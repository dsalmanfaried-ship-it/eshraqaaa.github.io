const stories=()=>`<button class="s all${F?'':' on'}" data-a="sc" data-k=""><i>${ic('spark',1,24)}</i>الكل</button>`+sch().map(o=>`<button class="s${F===o.k?' on':''}" data-a="sc" data-k="${E(o.k)}"><i style="--h:${hue(o.k)}">${av(o.k)}</i>${E(o.k.split(' ').slice(0,2).join(' '))}</button>`).join('');
const grp=()=>`<button class="c${G===''?' on':''}" data-a="gp" data-g="">كل الأقسام</button>`+D.g.map(x=>`<button class="c${G===x[0]?' on':''}" data-a="gp" data-g="${x[0]}">${E(x[1])}</button>`).join('');
const chips=()=>{const m={};V.forEach(v=>m[v.c]=(m[v.c]||0)+1);return `<button class="c${C?'':' on'}" data-a="ct" data-c="">الكل</button>`+Object.keys(m).sort((a,b)=>m[b]-m[a]).map(c=>`<button class="c${C===c?' on':''}" data-a="ct" data-c="${E(c)}">${E(c)}</button>`).join('')};
const ban=()=>`<div class="bn"><div class="bh"><span>${ic('spark',0,16)} رسالة تحفيزية</span><button class="r" data-a="rf">${ic('refresh')}</button></div><p id="bt">${msg()}</p><button class="pill" data-a="nm">${ic('edit',0,14)} ${ST.name?E(ST.name):'أضف اسمك'}</button></div>`;
function paint(){const r=flt(),h=tab==='home';$('#lst').innerHTML=r.length?r.slice(0,lim).map((v,i)=>card(v,h&&i===0&&!Q)).join(''):`<div class="emp" style="grid-column:1/-1">${ic('search',0,40)}<b>لا نتائج</b>جرّب كلمة أخرى أو اختر «الكل».</div>`;const mo=$('#more');if(mo)mo.style.display=r.length>lim?'block':'none'}
function render(){const m=$('#m');$('#cnt').textContent=`${ST.seen.length} / ${V.length} شاهدتها`;$('#sb').style.display=(tab==='home'||tab==='ex')?'flex':'none';
$('#nv').innerHTML=[['home','home','الرئيسية'],['ex','cmp','استكشاف'],['fv','heart','المفضلة'],['zk','spark','ذكر'],['mr','gear','المزيد']].map(a=>`<button class="${tab===a[0]?'on':''}" data-a="tb" data-t="${a[0]}">${ic(a[1],tab===a[0]&&a[0]==='fv')}${a[2]}</button>`).join('');
if(tab==='home'||tab==='ex'){const rc=ST.recent.map(by).filter(Boolean).slice(0,8);
m.innerHTML=(tab==='home'?`<button class="ask" data-a="ai">${ic('spark',1,20)} اسأل شيخك — أي سؤال في الدين</button>`+ban()+`<h3>مجموعات تريّح القلب</h3><div class="cl">${COL.map((c,i)=>`<button class="col" style="--h:${i*55+150}" data-a="co" data-k="${c[2]}" data-v="${c[3]}"><span>${c[0]}</span>${c[1]}</button>`).join('')}</div>`:'')+`<div class="ch">${grp()}</div><div class="st">${stories()}</div><div class="ch">${chips()}</div>`+(tab==='home'&&rc.length&&!F&&!C&&!Q?`<h3>${ic('clock',0,16)} شاهدتها مؤخراً</h3><div class="rowx">${rc.map(v=>card(v)).join('')}</div>`:'')+`<h3>${tab==='home'?'دروس لك':'كل الدروس'} <small style="color:var(--mut)">(${flt().length})</small></h3><div class="grid" id="lst"></div><button class="btn o mo" id="more" data-a="mo">عرض المزيد</button>`;paint()}
else if(tab==='zk')m.innerHTML=zk();else if(tab==='fv'){const f=ST.fav.map(by).filter(Boolean);m.innerHTML=f.length?`<h3>${ic('heart',1,16)} مفضلتك (${f.length})</h3><div class="grid">${f.map(v=>card(v)).join('')}</div>`:`<div class="emp">${ic('heart',0,56)}<b>قائمة المفضلة فارغة</b>اضغط على القلب في أي درس ليظهر هنا.<br><br><button class="btn" data-a="tb" data-t="ex">استكشف الدروس</button></div>`}
else m.innerHTML=more()}
function more(){return `<div class="stt" style="padding-top:8px"><div><b>${V.length}</b>درس</div><div><b>${ST.fav.length}</b>المفضلة</div><div><b>${ST.seen.length}</b>شاهدتها</div></div>
<div class="box"><div class="rw"><span>المظهر الداكن</span><button class="sw${document.documentElement.dataset.theme==='dark'?' on':''}" data-a="tg" aria-label="تبديل المظهر"></button></div></div>
<div class="box"><label>اسمك (يظهر في الرسائل التحفيزية)</label><input id="nm" value="${E(ST.name)}" placeholder="مثلاً: سلمى" maxlength="24"></div>
<div class="box"><b>إضافة درس</b><label>العنوان</label><input id="at"><label>الشيخ</label><input id="as1"><label>رابط يوتيوب أو ساوند كلاود</label><input id="au" dir="ltr" placeholder="https://youtu.be/…"><br><br><button class="btn" data-a="ad">إضافة</button></div>
<div class="box"><b>استيراد عدة روابط</b><label>كل سطر: العنوان | الرابط (أو الرابط فقط)</label><textarea id="bu" rows="4" dir="ltr"></textarea><br><br><button class="btn o" data-a="bk">استيراد</button></div>
<div class="box"><label>رابط الـ Worker (لـ «اسأل شيخك»)</label><input id="wk" dir="ltr" value="${E(ST.wk||'')}" placeholder="https://…workers.dev"></div>
<div class="box"><b>صورة شيخ</b><label>اختاري الشيخ</label><select id="ps" class="aq">${sch().map(o=>`<option>${E(o.k)}</option>`).join('')}</select><label>الصورة (تتحفظ على جهازك)</label><input type="file" id="pf" accept="image/*"></div>
<div class="box"><button class="btn d" data-a="rs" style="width:100%">مسح المشاهدات والسجل</button></div>
<p style="text-align:center;color:var(--mut);font-size:12px;padding:0 20px">بياناتك محفوظة على جهازك فقط (LocalStorage).</p>`}
const yid=u=>{u=String(u).trim();if(/^https?:\/\/(on\.)?soundcloud\.com\//.test(u))return 'sc:'+u.split('?')[0];let m=u.match(/[?&]list=([\w-]+)/);if(m&&!/[?&]v=/.test(u))return 'pl:'+m[1];m=u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);return m?m[1]:''};
const kind=y=>!y?'':y.startsWith('sc:')?'sc':y.startsWith('pl:')?'pl':'yt';
const embed=v=>kind(v.y)==='pl'?`https://www.youtube-nocookie.com/embed/videoseries?list=${v.y.slice(3)}&autoplay=1&rel=0&playsinline=1`:`https://www.youtube-nocookie.com/embed/${v.y}?autoplay=1&rel=0&playsinline=1`;
const ytu=v=>!v.y?`https://www.youtube.com/results?search_query=${encodeURIComponent(v.q)}`:kind(v.y)==='sc'?v.y.slice(3):kind(v.y)==='pl'?`https://www.youtube.com/playlist?list=${v.y.slice(3)}`:`https://www.youtube.com/watch?v=${v.y}`;
async function share(v){const t=v.t+' — '+v.s,url=ytu(v);try{if(navigator.share){await navigator.share({title:t,text:t,url});return}}catch(e){if(e.name==='AbortError')return}try{await navigator.clipboard.writeText(t+'\n'+url);toast('تم نسخ الرابط')}catch(e){toast('تعذّر النسخ')}}
const tog=(k,id)=>{const a=ST[k],i=a.indexOf(id);i<0?a.unshift(id):a.splice(i,1);save()};
const pa=()=>{const v=cur,f=ST.fav.includes(v.id),s=ST.seen.includes(v.id);$('#pa').innerHTML=`<button class="ib${f?' on':''}" data-a="fv" data-i="${v.id}">${ic('heart',f)} مفضلة</button><button class="ib ck${s?' on':''}" data-a="sn" data-i="${v.id}">${ic('check')} شاهدته</button><button class="ib" data-a="sh" data-i="${v.id}">${ic('share')} مشاركة</button><button class="ib" data-a="ai">${ic('spark')} المرشد</button>`};
function opn(id){const v=by(id);if(!v)return;cur=v;if(kind(v.y)==='sc'){ST.recent=[id,...ST.recent.filter(x=>x!==id)].slice(0,20);if(!ST.seen.includes(id))ST.seen.unshift(id);save();playSC(v);render();return}ST.recent=[id,...ST.recent.filter(x=>x!==id)].slice(0,20);save();
const nx=V.filter(x=>x.id!==id&&(strip(x.s)===strip(v.s)||x.c===v.c)).sort((a,b)=>(ST.seen.includes(a.id)-ST.seen.includes(b.id))||(!!b.y-!!a.y)).slice(0,6);
$('#pi').innerHTML=`<div class="hd"><button class="ib" data-a="cl">${ic('x',0,22)}</button><b>${E(v.c)}</b><a class="ib" href="${ytu(v)}" target="_blank" rel="noopener">${ic('ext')} يوتيوب</a></div><div class="vid">${v.y?`<iframe src="${embed(v)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`:`${art(v)}<div class="cta"><a class="btn" href="${ytu(v)}" target="_blank" rel="noopener" data-a="wt">${ic('play',1)} شاهد على يوتيوب</a></div>`}</div><div class="pt">${E(v.t)}</div><div class="sc">${E(v.s)}</div><div class="ac" id="pa"></div>${v.y?'':`<div class="box" style="margin:10px 0"><label>لقيتي الدرس على يوتيوب؟ الصقي رابطه ليتشغّل داخل التطبيق</label><input id="lk" dir="ltr" placeholder="https://youtu.be/…"><br><br><button class="btn o" data-a="lk" data-i="${v.id}">حفظ الرابط</button></div>`}<h3 style="margin:14px 0 4px">التالي</h3>${nx.map(x=>`<div class="un" data-a="op" data-i="${x.id}"><div class="th">${art(x)}${kind(x.y)==='yt'?`<img loading="lazy" alt="" src="https://i.ytimg.com/vi/${x.y}/hqdefault.jpg" onerror="this.remove()">`:''}</div><div><div class="tt">${E(x.t)}</div><div class="sc">${E(x.s)}</div></div></div>`).join('')}`;
pa();$('#pl').classList.add('on');$('#pi').scrollTop=0;clearTimeout(tm);if(v.y)tm=setTimeout(()=>{if(!ST.seen.includes(v.id)){ST.seen.unshift(v.id);save();render();pa()}},30000);render()}
function ai(q){const w=$('#as');w.classList.add('on');if(!$('#ao')){$('#ab').innerHTML=`<div class="hd"><button class="ib" data-a="ca">${ic('x',0,22)}</button><b>${ic('spark')} اسأل شيخك</b></div><div id="ac0"></div><div class="qs" id="qs"></div><div class="ans" id="ao">اسأل أي سؤال في الدين. أنا ذكاء اصطناعي ولست مفتياً، وللفتاوى الخاصة ارجع لعالم موثوق.</div><div class="aqr"><input class="aq" id="aq" placeholder="اكتب سؤالك هنا…"><button class="btn" data-a="ak">${ic('share',0)}</button></div>`}
$('#ac0').innerHTML=cur?`<div class="sc" style="margin-bottom:6px">الدرس الحالي: ${E(cur.t)} — ${E(cur.s)}</div>`:'';$('#qs').innerHTML=(cur?['لخّص لي موضوع هذا الدرس','ما أهم الفوائد العملية منه؟','اقترح أسئلة للمراجعة بعد المشاهدة']:['كيف أحافظ على الصلاة في وقتها؟','ما فضل الاستغفار وكيف أكثر منه؟','كيف أبدأ حفظ القرآن؟','كيف أتوب من ذنب تكرر؟']).map(t=>`<button data-a="aq" data-q="${E(t)}">${E(t)}</button>`).join('');if(q)ask(q)}
async function ask(q){const o=$('#ao');if(!q.trim())return;const W=(ST.wk||'').trim();if(!W){o.textContent='ضيفي رابط الـ Worker من «المزيد» عشان «اسأل شيخك» يشتغل.';return}o.textContent='جارٍ التفكير…';const x=cur?`(الدرس الحالي: «${cur.t}» — ${strip(cur.s)}) `:'';try{const r=await fetch(W,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:x+q})});const j=await r.json();o.textContent=j.answer||'تعذّر الرد الآن.'}catch(e){o.textContent='تعذّر الاتصال بالمرشد الآن، حاولي بعد قليل.'}}
const go=()=>{render()};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=b.dataset.i,v=i&&by(i);
if(a==='op'){opn(i)}else if(a==='fv'){tog('fav',i);render();if(cur)pa()}else if(a==='sn'){tog('seen',i);render();if(cur)pa()}else if(a==='sh')share(v);
else if(a==='tb'){tab=b.dataset.t;F=C=Q='';lim=tab==='ex'?24:13;$('#q').value='';scrollTo(0,0);fresh();render()}
else if(a==='sc'){F=b.dataset.k;lim=tab==='ex'?24:13;render()}else if(a==='ct'){C=b.dataset.c;render()}
else if(a==='mo'){lim+=24;paint()}else if(a==='rf'){mi++;$('#bt').innerHTML=msg()}
else if(a==='nm'){tab='mr';render();scrollTo(0,0);setTimeout(()=>$('#nm').focus(),50)}
else if(a==='cl'){$('#pl').classList.remove('on');$('#as').classList.remove('on');$('#pi').innerHTML='';clearTimeout(tm)}
else if(a==='ca')$('#as').classList.remove('on');else if(a==='mc'){$('#mpf').innerHTML='';$('#mp').classList.remove('on');document.body.classList.remove('mpo')}else if(a==='gp'){G=b.dataset.g===''?'':+b.dataset.g;F='';lim=tab==='ex'?24:13;render()}else if(a==='lk'){const y=yid($('#lk').value);if(!y){toast('الرابط غير صالح');return}ST.lk=ST.lk||{};ST.lk[i]=y;save();mk();toast('تم الحفظ');opn(i)}else if(a==='ai'){if(!b.closest('#pl'))cur=null;ai()}else if(a==='zt')zt(e);else if(a==='co'){C=b.dataset.k==='c'?b.dataset.v:'';Q=b.dataset.k==='q'?b.dataset.v:'';F='';tab='ex';lim=24;$('#q').value=Q;scrollTo(0,0);fresh();render()}else if(a==='aq')ask(b.dataset.q);else if(a==='ak')ask($('#aq').value);
else if(a==='wt'){if(!ST.seen.includes(cur.id)){ST.seen.unshift(cur.id);save();render();pa()}}
else if(a==='tg'){setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');render()}
else if(a==='ad'){const t=$('#at').value.trim(),s=$('#as1').value.trim(),y=yid($('#au').value);if(!t||!y){toast('اكتبي العنوان ورابط يوتيوب صحيح');return}ST.custom.push({t,s:s||'غير محدد',y});save();mk();toast('تمت الإضافة');render()}
else if(a==='bk'){let n=0;$('#bu').value.split('\n').forEach(l=>{const p=l.split('|'),y=yid(p[p.length-1]);if(y){ST.custom.push({t:p.length>1?p[0].trim():'درس جديد',s:'غير محدد',y});n++}});save();mk();toast(n?`تم استيراد ${n} درس`:'لا توجد روابط صالحة');render()}
else if(a==='rs'){if(b.dataset.s){ST.seen=[];ST.recent=[];ST.fav=[];save();toast('تم المسح');render()}else{b.dataset.s=1;b.textContent='اضغطي مرة أخرى للتأكيد'}}});
$('#q').addEventListener('input',e=>{Q=e.target.value;lim=tab==='ex'?24:13;if(tab==='home'||tab==='ex')render();$('#q').focus()});
document.addEventListener('input',e=>{if(e.target.id==='nm'){ST.name=e.target.value.trim();save()}if(e.target.id==='wk'){ST.wk=e.target.value.trim();save()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='aq')ask(e.target.value);if(e.key==='Escape')document.querySelectorAll('.sh').forEach(s=>s.classList.remove('on'))});
$('#pl').addEventListener('click',e=>{if(e.target.id==='pl')$('#pl').classList.remove('on'),$('#pi').innerHTML='',clearTimeout(tm)});
$('#as').addEventListener('click',e=>{if(e.target.id==='as')$('#as').classList.remove('on')});
setInterval(()=>{const t=$('#bt');if(t&&!document.hidden){mi++;t.innerHTML=msg()}},15000);
const phf=k=>{const P=window.PHOTOS||{};for(const n in P)if(strip(n)===k)return P[n];return ''};
function playSC(v){const u=v.y.slice(3),set=/\/sets\//.test(u);$('#mpt').textContent='🎧 '+v.t;$('#mpf').innerHTML='<iframe height="'+(set?166:120)+'" allow="autoplay" src="https://w.soundcloud.com/player/?url='+encodeURIComponent(u)+'&auto_play=true&visual=false&color=%23e0bd6b"></iframe>';$('#mp').classList.add('on');document.body.classList.add('mpo')}
const av=k=>{const pu=(ST.ph&&ST.ph[k])||phf(k);if(pu)return `<img class="av" alt="" src="${pu}">`;const h=hue(k),t=h%3;return `<svg class="av" viewBox="0 0 100 100"><path d="M14 100c0-22 16-32 36-32s36 10 36 32z" fill="#f4f0e6"/><ellipse cx="50" cy="44" rx="20" ry="24" fill="hsl(${25+h%12} 45% ${55+h%15}%)"/><path d="M30 46c0 24 8 32 20 32s20-8 20-32c-4 10-12 12-20 12s-16-2-20-12z" fill="${h%2?'#2a2a2a':'#e8e8e8'}"/>${t==0?'<ellipse cx="50" cy="24" rx="25" ry="13" fill="#fff"/><path d="M25 26c8 6 42 6 50 0" stroke="#c9a24a" stroke-width="3" fill="none"/>':t==1?'<path d="M24 40c0-26 10-30 26-30s26 4 26 30c-6-14-14-16-26-16s-20 2-26 16z" fill="#fff"/><path d="M26 28h48" stroke="#222" stroke-width="3"/>':'<path d="M31 28c2-14 36-14 38 0z" fill="#fff"/>'}<circle cx="43" cy="44" r="2" fill="#222"/><circle cx="57" cy="44" r="2" fill="#222"/></svg>`};
const COL=[['🌙','رقائق تريّح القلب','c','رقائق'],['🎧','تلاوات خاشعة','c','تلاوات'],['🕌','خشوع الصلاة','q','الصلاة'],['👨‍👩‍👧','بيتك وأخلاقك','c','أسرة وأخلاق'],['📜','قصص الأنبياء','c','قصص الأنبياء'],['🔥','للشباب: التوبة','q','التوبة']];
const ZK=['صلِّ على النبي ﷺ','أستغفر الله','سبحان الله','الحمد لله','لا إله إلا الله','الله أكبر','اللهم صلِّ وسلّم على نبينا محمد'];
const zk=()=>`<div class="zk"><div style="color:var(--mut)">رصيدك من الذكر</div><div class="zc" id="zc">${ST.zk}</div><button class="zb" data-a="zt">${ic('spark',1,40)}<span>اضغط للذكر</span></button><p style="color:var(--mut);font-size:13px">كل ضغطة تطلع لك ذكر يزكّي لسانك 🤍</p></div>`;
function zt(e){ST.zk++;save();$('#zc').textContent=ST.zk;const d=document.createElement('div');d.className='fz';d.textContent=ZK[Math.floor(Math.random()*ZK.length)];d.style.left=(e.clientX||innerWidth/2)+'px';d.style.top=(e.clientY-30)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1200);try{navigator.vibrate&&navigator.vibrate(12)}catch(x){}if(ST.zk%33===0){toast('ما شاء الله، '+ST.zk+' ذكر 🌙');for(let i=0;i<14;i++){const c=document.createElement('div');c.className='fz';c.textContent=['✨','🌙','⭐','🤍'][i%4];c.style.left=Math.random()*innerWidth+'px';c.style.top=(innerHeight*.5+Math.random()*200)+'px';document.body.appendChild(c);setTimeout(()=>c.remove(),1200)}}}
const fresh=()=>{const m=$('#m');m.className='fresh';clearTimeout(m.t);m.t=setTimeout(()=>m.className='',1000)};
document.addEventListener('change',e=>{if(e.target.id!=='pf'||!e.target.files[0])return;const k=$('#ps').value,r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,160,160);ST.ph[k]=c.toDataURL('image/jpeg',.8);save();toast('تم حفظ الصورة');render()};im.src=r.result};r.readAsDataURL(e.target.files[0])});
setTimeout(()=>{const s=$('#sp');s&&s.remove()},1700);fresh();mk();render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
